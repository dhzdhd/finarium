include: package:flutter_lints/flutter.yaml

plugins:
  riverpod_lint: 3.1.9

analyzer:
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**

    - rust_builder/cargokit/**
linter:
  rules:
    avoid_print: false
    prefer_single_quotes: true
